# Firewalld Configuration for Trigger Application
#
# This configuration defines the default settings for firewalld
# when running the Trigger application.
#
# Author: hyperpolymath
# Version: 1.0.0
#
# See: firewalld.conf(5) for more information

[INCLUDE]
# Include default firewalld configuration
# Path may vary by distribution
# Include /usr/lib/firewalld/firewalld.conf

[DEFAULT]
# Default zone for new interfaces
# Use 'trigger' zone for Trigger-specific rules
DefaultZone=trigger

# Minimal markup for firewall-cmd
MinimalMarkup=0

# Cleanup unused items on exit
CleanupOnExit=1

# Lockdown: When enabled, only applications in /etc/firewalld/lockdown.d/ can manage firewalld
# Disabled by default for development, enable for production
Lockdown=0

# Logging
# Log denied packets
LogDenied=all

# Automatic helpers
# Automatically load helper modules
AutomaticHelpers=1

# Allow IP forwarding
IPv6_rpfilter=1

# Default rich rule priority (higher = processed first)
RichRulePriority=0

# Default ingress rich rule timeout (seconds)
RichRuleTimeout=0

# Default egress rich rule timeout (seconds)
RichRuleTimeoutEgress=0

# Default zone for new interfaces when DefaultZone is not set
# This is a fallback
FallbackZone=public
