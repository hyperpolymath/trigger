# firewalld.conf - Firewall configuration for Trigger Application
#
# This configuration defines the firewall rules for the Trigger application.
# All ports are DROPPED by default, only explicitly allowed ports are open.
#
# SPDX-License-Identifier: CC-BY-SA-4.0

# Firewalld Defaults
DefaultZone=drop
MinimalMark=100
CleanupOnExit=yes
Lockdown=yes
IPv6_rpfilter=yes
IndividualCalls=no
LogDenied=all
AutomaticRules=yes
AutomaticConnections=yes

# SELinux Context
SELinuxProviderType=none
SELinuxContextSystem=system_u:object_r:firewalld_config_t:s0

# Flush all rules on reload
FlushAllOnReload=yes
