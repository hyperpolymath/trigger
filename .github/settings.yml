  category_a:
    name: "General"
    emoji: "💬"
    description: "General discussion about Trigger"

  category_b:
    name: "Help"
    emoji: "❓"
    description: "Get help using Trigger"

  category_c:
    name: "Feature Requests"
    emoji: "🚀"
    description: "Request new features"

  category_d:
    name: "Development"
    emoji: "🔧"
    description: "Development-related discussions"

  category_e:
    name: "RSR Compliance"
    emoji: "📋"
    description: "RSR template compliance discussions"
