# Milestones
milestones:
  - title: "RSR Compliance"
    state: open
    description: "Achieve full RSR template compliance"

  - title: "v1.1.0"
    state: open
    description: "First stable release"

  - title: "v1.0.0"
    state: closed
    description: "Initial release"

# Auto-labeling
# https://github.com/marketplace/actions/labeler
labels_from_package:
  - "Ada/**" -> "Ada/SPARK"
  - "Zig/**" -> "Zig"
  - "Idris/**" -> "Idris2"
  - "src/**" -> "Ada/SPARK"
  - "ffi/zig/**" -> "Zig"
  - "ffi/idris2/**" -> "Idris2"
  - "**.adoc" -> "documentation"
  - ".github/workflows/**" -> "CI/CD"

# Code scanning
code_scanning:
  enabled: true

# Secret scanning
secret_scanning:
  enabled: true

# Dependency graph
dependency_graph:
  enabled: true

# Discussions
# https://docs.github.com/en/communities/managing-discussions-for-your-community/configuring-discussions
# 
discussions:
