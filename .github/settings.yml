# Repository Settings
# https://docs.github.com/en/communities/using-templates-to-configure-new-repositories/configuring-your-repository-using-the-repository-settings-template

# Basic settings
repository:
  # The name of the repository. Changing this will rename the repository
  name: trigger

  # A short description of the repository that will show up on GitHub
  description: Telegram channel reporting utility with multi-account management, persistent sessions, and automated workflows

  # A URL with more information about the repository
  homepage: https://github.com/hyperpolymath/trigger

  # A comma-separated list of topics to set on the repository
  topics: telegram, reporting, automation, ada, spark, zig, idris2, security, multi-account

  # Either `true` to make the repository private, or `false` to make it public.
  private: false

  # Either `true` to enable issues for this repository, `false` to disable them.
  has_issues: true

  # Either `true` to enable the wiki for this repository, `false` to disable it.
  has_wiki: false

  # Either `true` to enable downloads for this repository, `false` to disable them.
  has_downloads: true

  # Updates to the default branch will only be allowed if a required status check passes
  # Set to `true` to require branches to be up to date before merging
  # https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-required-status-checks
  require_status_checks_before_merge: true

  # Require branches to be up to date before merging
  require_up_to_date_before_merge: true

  # Require conversation resolution before merging
  require_conversation_resolution: true

  # Require signed commits to be pushed
  require_signed_commits: false

  # Require linear history
  require_linear_history: false

  # Allow squash merging
  allow_squash_merge: true

  # Allow merge committing
  allow_merge_commit: true

  # Allow rebase merging
  allow_rebase_merge: true

  # Allow auto-merge
  allow_auto_merge: true

  # Delete head branches when pulls are merged
  delete_head_branch_on_merge: true

  # Allow updates to pull request branches that update the target branch
  allow_update_branch: true

  # Default branch name
  default_branch: main

# Branch protection settings
branch_protection:
  main:
    required_status_checks:
      strict: true
      contexts: []

    enforce_admins: true

    required_pull_request_reviews:
      dismiss_stale_reviews: true
      require_code_owner_reviews: true
      required_approving_review_count: 1

    required_signatures: false

    restrictions: null

# Collaborators
collaborators: []

# Teams
teams: []

# Labels
