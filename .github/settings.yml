  - name: "Idris2"
    color: "#e91e63"
    description: "Related to Idris2 API code"

  - name: "bug"
    color: "#d73a4a"
    description: "Something isn't working"

  - name: "enhancement"
    color: "#a2eeef"
    description: "New feature or request"

  - name: "documentation"
    color: "#0075ca"
    description: "Improvements or additions to documentation"

  - name: "good first issue"
    color: "#7057ff"
    description: "Good for newcomers"

  - name: "help wanted"
    color: "#008672"
    description: "Extra attention is needed"

  - name: "question"
    color: "#d876e3"
    description: "Further information is requested"

  - name: "security"
    color: "#ee0701"
    description: "Security-related issue"

  - name: "CI/CD"
    color: "#005cc5"
    description: "Continuous integration and deployment"

  - name: "RSR-compliance"
    color: "#6f42c1"
    description: "RSR template compliance"

  - name: "performance"
    color: "#006b75"
    description: "Performance-related"

  - name: "refactor"
    color: "#fbcca0"
    description: "Code refactoring needed"

  - name: "breaking"
    color: "#ff4444"
